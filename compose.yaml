services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentix
      POSTGRES_PASSWORD: agentix
      POSTGRES_DB: agentix
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agentix_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentix -d agentix"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  agentix_data:
