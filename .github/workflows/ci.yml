name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentix
          POSTGRES_PASSWORD: agentix
          POSTGRES_DB: agentix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentix -d agentix_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AGENTIX_DATABASE_URL: postgresql+psycopg://agentix:agentix@localhost:5432/agentix_test
      AGENTIX_TEST_DATABASE_URL: postgresql+psycopg://agentix:agentix@localhost:5432/agentix_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run pytest -q
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
